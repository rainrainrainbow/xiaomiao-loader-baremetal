name: Build Baremetal Loader

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-nonwifi:
    name: "Build (no WiFi)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with ESP-IDF v5.5.4 (no WiFi)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.4
          target: esp32
          command: |
            idf.py build
            idf.py size
            idf.py size-components
            python3 -c "import re; d=open('sdkconfig').read(); import sys; [print(l) for l in d.splitlines() if 'FLASHMODE' in l or 'SPIRAM_MODE' in l]"
            idf.py merge-bin -o xiaomiao-loader-merged.bin
            ls -la build/*.bin
            ls -la *.bin 2>/dev/null || true

      - name: Upload artifacts (no WiFi)
        uses: actions/upload-artifact@v4
        with:
          name: xiaomiao-loader-nonwifi
          path: |
            build/xiaomiao-loader-baremetal.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/ota_data_initial.bin
            build/xiaomiao-loader-merged.bin
            build/xiaomiao-loader-baremetal.map
          if-no-files-found: error

  build-wifi:
    name: "Build (WiFi OTA)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with ESP-IDF v5.5.4 (WiFi OTA)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.4
          target: esp32
          command: |
            export SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.wifi"
            idf.py build
            idf.py size
            python3 -c "d=open('sdkconfig').read(); print([l for l in d.splitlines() if 'XIAOMIAO_ENABLE_WIFI' in l or 'FLASHMODE' in l])"
            idf.py merge-bin -o xiaomiao-loader-merged-wifi.bin
            ls -la build/*.bin
            ls -la *.bin 2>/dev/null || true

      - name: Upload artifacts (WiFi)
        uses: actions/upload-artifact@v4
        with:
          name: xiaomiao-loader-wifi
          path: |
            build/xiaomiao-loader-baremetal.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/ota_data_initial.bin
            build/xiaomiao-loader-merged-wifi.bin
            build/xiaomiao-loader-baremetal.map
          if-no-files-found: error